[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-agent-wb"
version = "0.1.1"
description = "Tencent WorkBuddy (CodeBuddy Agent CLI) native harness plugin & connector adapter for MindIE Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mindie-knowledge>=0.13.0",
    "remote-dev>=0.10.0",
    "mindie-diagnostics>=0.5.0",
]

[project.optional-dependencies]
components = [
    "mindie-coordinator>=0.6.0",
    "mindie-profiler>=0.5.0",
    "mindie-sim>=0.7.0",
    "mindie-debugger>=0.1.0",
    "npu-top>=0.3.0",
]
test = [
    "pytest>=8,<10",
    "jsonschema>=4",
]

[tool.uv.sources]
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "883115068d1442f5d2b7eea226dcf31b359d6916" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "ba62b643af4bc8265c8206a32a1fe21733d9d119" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "5ae643e19223f2181ecdbaa3edaf464137c4805e" }

[tool.uv]
override-dependencies = [
    "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@883115068d1442f5d2b7eea226dcf31b359d6916",
    "remote-dev @ git+https://github.com/mindie-agent/remote-dev@ba62b643af4bc8265c8206a32a1fe21733d9d119",
    "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@5ae643e19223f2181ecdbaa3edaf464137c4805e",
    "mindie-coordinator @ git+https://github.com/mindie-agent/coordinator@29b651c5f05bd22de6abf51244ba8c4a3c1eb1c0",
    "mindie-profiler @ git+https://github.com/mindie-agent/profiler@7cdd56b6cc9e0e7f603368393497487dd2dbfe39",
    "mindie-sim @ git+https://github.com/mindie-agent/sim@f5608b4943f515c401d2f9b12fffb579a1e2571b",
    "mindie-debugger @ git+https://github.com/mindie-agent/debugger@863c2a5fac3108ee9c2c5fabba054f08d14144ea",
    "npu-top @ git+https://github.com/mindie-agent/npu-top@ff78215dbe94bb3bd16abc6897878918748b8aee",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
]
